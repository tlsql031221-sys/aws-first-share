services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_PATH: /data/share.db
      SECRET_KEY: ${SECRET_KEY:-development-only-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-관리자}
    volumes:
      - share_data:/data
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  share_data:
