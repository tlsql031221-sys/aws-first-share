<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>먼저가져가 - 선착순 나눔</title><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/schedule.css"></head>
<body>
<header><div class="wrap nav"><div class="brand"><span class="logo">🎁</span><div><b>먼저가져가</b><small>좋은 물건, 좋은 이웃에게</small></div></div><div class="navActions"><button class="primary" id="open">＋ 물건 등록</button><div class="authActions" id="guestActions"><button class="navButton" id="openLogin">로그인</button><button class="navButton join" id="openRegister">회원가입</button></div><div class="authActions hidden" id="userActions"><span class="userChip" id="userName"></span><button class="navButton join" id="openMyPage">마이페이지</button><button class="navButton" id="logout">로그아웃</button></div></div></div></header>
<section class="hero"><div class="wrap"><div class="heroBox"><i></i><div class="heroContent"><span class="pill">⚡ 정해진 시간, 먼저 신청한 한 명에게 나눔돼요</span><h1>안 쓰는 물건이<br><span>누군가의 보물</span>이 되도록.</h1><p>물건과 신청 시작 시간을 등록하고, 시작 시각부터 선착순으로 신청하세요. 모든 사용자가 같은 나눔 현황을 확인합니다.</p></div></div></div></section>
<main class="wrap"><div class="sectionHead"><div><div class="eyebrow">지금 나눔 중</div><h2>새 주인을 기다려요</h2></div><input id="search" class="search" placeholder="🔎  물건이나 동네 검색"></div><div class="filters" id="filters"></div><div class="grid" id="grid"></div></main>
<div class="modal" id="modal"><form class="sheet" id="form"><div class="sheetTop"><div><div class="eyebrow">새 나눔</div><h2>어떤 물건을 나눌까요?</h2></div><button type="button" class="close" id="close">✕</button></div><div class="form">
<label>물건 이름<input name="title" required maxlength="80" placeholder="예: 미니 선풍기"></label><label>물건 설명<textarea name="description" required maxlength="500" rows="3" placeholder="상태와 특징을 알려주세요"></textarea></label><div class="row"><label>분류<select name="category"><option>생활</option><option>디지털</option><option>도서</option><option>의류</option><option>기타</option></select></label><label>나눔 동네<input name="location" required maxlength="50" placeholder="예: 성수동"></label></div><div class="ownerNotice">로그인한 닉네임으로 나눔이 등록돼요.</div><div class="timeField"><label>신청 시작 시간 (초 단위)<input id="claimStartAt" name="claimStartAt" type="datetime-local" step="1" required></label><button type="button" class="timeConfirm" id="confirmClaimStart">시간 확인</button><div class="timeConfirmed" id="claimStartConfirmed">시간을 선택한 뒤 확인해 주세요.</div></div><label>사진 주소 (선택)<input name="imageUrl" type="url" placeholder="https://..."></label><button class="submit">나눔 등록하기</button></div></form></div>
<div class="modal" id="registerModal"><form class="sheet claimSheet" id="registerForm"><div class="sheetTop"><div><div class="eyebrow">새 계정</div><h2>회원가입</h2></div><button type="button" class="close" id="registerClose">✕</button></div><div class="form"><label>아이디<input name="username" required minlength="4" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="영문, 숫자, 밑줄 4~20자"></label><label>닉네임<input name="displayName" required minlength="2" maxlength="20" placeholder="신청할 때 표시될 이름"></label><label>비밀번호<input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="8자 이상"></label><label>비밀번호 확인<input name="confirmPassword" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="비밀번호를 다시 입력"></label><button class="submit">가입하고 로그인</button><button type="button" class="textButton" id="goLogin">이미 계정이 있어요</button></div></form></div>
<div class="modal" id="loginModal"><form class="sheet claimSheet" id="loginForm"><div class="sheetTop"><div><div class="eyebrow">다시 오셨네요</div><h2>로그인</h2></div><button type="button" class="close" id="loginClose">✕</button></div><div class="form"><label>아이디<input name="username" required autocomplete="username" placeholder="아이디"></label><label>비밀번호<input name="password" type="password" required autocomplete="current-password" placeholder="비밀번호"></label><button class="submit">로그인</button><button type="button" class="textButton" id="goRegister">처음이신가요? 회원가입</button></div></form></div>
<div class="modal" id="myPageModal"><section class="sheet myPageSheet"><div class="sheetTop"><div><div class="eyebrow">나의 나눔 기록</div><h2>마이페이지</h2><p class="myProfile" id="myProfile"></p></div><button type="button" class="close" id="myPageClose">✕</button></div><div class="myPageBody"><section class="mySection"><div class="mySectionHead"><h3>내가 등록한 나눔</h3><span id="createdCount">0개</span></div><div class="myList" id="myCreatedList"></div></section><section class="mySection"><div class="mySectionHead"><h3>내가 신청한 나눔</h3><span id="claimedCount">0개</span></div><div class="myList" id="myClaimedList"></div></section></div></section></div>
<div class="toast" id="toast"></div><script src="/static/app.js"></script></body></html>
